name: Publish visual guides

on:
    push:
        branches: [main]
        paths:
            - "_docs/**"
            - ".github/workflows/docs-pages.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v5

            - name: Stage standalone rendered pages
              run: |
                  mkdir _site
                  cp _docs/index.html _docs/plugin-workflow.html _docs/czi-tile-assembly.html _site/
                  touch _site/.nojekyll

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
